services:
  db:
    image: postgres:15-alpine
    container_name: postgres-db
    environment:
      POSTGRES_DB: appdb
      POSTGRES_USER: postgres_user
      POSTGRES_PASSWORD: rpi_secure_password_123
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres_user -d appdb"]
      interval: 5s
      timeout: 3s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: backend-api
    ports:
      - "8080:5000"
    environment:
      DB_HOST: db
      DB_PORT: 5432
      POSTGRES_DB: appdb
      POSTGRES_USER: postgres_user
      POSTGRES_PASSWORD: rpi_secure_password_123
      NODE_NAME: docker-host
    depends_on:
      db:
        condition: service_healthy

